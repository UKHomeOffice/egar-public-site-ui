apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-public-site
spec:
  podSelector:
    matchLabels:
      name: {{ include "public-site.serviceName" . }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-internal
        - podSelector:
            matchLabels:
              name: ingress
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-external
        - podSelector:
            matchLabels:
              name: ingress
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- if .Values.ingress.poise.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: service-site-ingress-poise
  labels:
    cert-manager.io/solver: http01
  annotations:
    cert-manager.io/enabled: "true"
    ingress.kubernetes.io/force-ssl-redirect: "true"
    ingress.kubernetes.io/backend-protocol: "HTTPS"
    ingress.kubernetes.io/proxy-body-size: "20m"
    ingress.kubernetes.io/ssl-ciphers: "!aNULL:!EXPORT56:!SHA1:!SHA256:!SHA384:EECDH+TLSv1.2+HIGH"
    ingress.kubernetes.io/ssl-prefer-server-ciphers: "true"
    ingress.kubernetes.io/ssl-protocols: TLSv1.2 TLSv1.3
    ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=63072000; includeSubDomains";
    ingress.kubernetes.io/whitelist-source-range: {{ required "ingress.poise.whitelistSourceRange is required when ingress.poise.enabled=true" .Values.ingress.poise.whitelistSourceRange | quote }}
spec:
  tls:
    - hosts:
        - {{ .Values.ingress.external.host | quote }}
      secretName: {{ .Values.ingress.external.tlsSecretName }}
  ingressClassName: {{ .Values.ingress.external.className }}
  rules:
    - host: {{ .Values.ingress.external.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "public-site.serviceName" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}